# A one-off run on a check branch: run out's checks and build it.
name: release

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks
        run: |
          set +e
          swift build --product QingyanChecks > "$RUNNER_TEMP/cb.log" 2>&1 || { grep -nE "error" "$RUNNER_TEMP/cb.log" | cut -c1-600 | tail -40; exit 1; }
          SWIFT_BACKTRACE=interactive=no,color=no script -q "$RUNNER_TEMP/checks.log" "$(swift build --show-bin-path)/QingyanChecks" > /dev/null 2>&1
          echo "exit $?"
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$RUNNER_TEMP/checks.log" > "$RUNNER_TEMP/plain.log"
          grep -aE "^FAIL|^PASS Links|^PASS Shelf|All checks passed" "$RUNNER_TEMP/plain.log" | cut -c1-300
          if ! grep -aq "All checks passed" "$RUNNER_TEMP/plain.log"; then
            echo "-- crash"
            grep -anE "Crash|Fatal|crashed|Thread 0|Thread [0-9]+ .*crashed| in .* at /|^[0-9]+ .* in " "$RUNNER_TEMP/plain.log" | cut -c1-330 | head -70
            exit 1
          fi

      - name: Build
        if: always()
        run: |
          set +e
          swift build --product Qingyan > "$RUNNER_TEMP/build.log" 2>&1; code=$?
          grep -nE "error:|complete!" "$RUNNER_TEMP/build.log" | cut -c1-600 | tail -60
          grep -nE "warning:" "$RUNNER_TEMP/build.log" | grep -E "Shelf.swift|HelperLink.swift" | cut -c1-400 | sort -u | tail -20
          exit $code
