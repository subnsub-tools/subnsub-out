# A one-off run on a check branch: run out's checks and build it.
name: release

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks
        run: |
          set +e
          swift build --product QingyanChecks > "$RUNNER_TEMP/cb.log" 2>&1 || { grep -nE "error" "$RUNNER_TEMP/cb.log" | cut -c1-600 | tail -40; exit 1; }
          script -q "$RUNNER_TEMP/checks.log" "$(swift build --show-bin-path)/QingyanChecks" > /dev/null 2>&1
          echo "exit $?"
          grep -aE "FAIL|PASS Links|PASS Shelf|All checks passed|Fatal|BUG IN" "$RUNNER_TEMP/checks.log" | cut -c1-600 | tail -40
          echo "-- tail"; tail -6 "$RUNNER_TEMP/checks.log" | cut -c1-300
          if ! grep -aq "All checks passed" "$RUNNER_TEMP/checks.log"; then
            sleep 8
            for f in "$HOME"/Library/Logs/DiagnosticReports/QingyanChecks*; do
              echo "-- $f"
              python3 -c 'import json,sys; t=open(sys.argv[1]).read(); i=t.index("\n"); d=json.loads(t[i+1:]); print(d.get("exception")); print(d.get("asi")); th=[x for x in d["threads"] if x.get("triggered")][0]; print(th.get("queue")); [print(fr.get("symbol"), fr.get("sourceFile"), fr.get("sourceLine")) for fr in th["frames"][:30]]' "$f" || head -c 3000 "$f"
            done
            exit 1
          fi

      - name: Build
        if: always()
        run: |
          set +e
          swift build --product Qingyan > "$RUNNER_TEMP/build.log" 2>&1; code=$?
          grep -nE "error:|Build complete" "$RUNNER_TEMP/build.log" | cut -c1-600 | tail -60
          grep -nE "warning:" "$RUNNER_TEMP/build.log" | grep -E "Shelf.swift|HelperLink.swift" | cut -c1-400 | sort -u | tail -20
          exit $code
