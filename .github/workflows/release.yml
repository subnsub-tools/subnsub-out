# Every push to main is checked and built, except one that changes only the README or the
# license: words alone make no new build (and no update on every Mac). A v0.1.<build> tag a
# publisher pushes is built, signed and released.
#
# The app is signed with the self-signed certificate "input signing (SUB&SUB)", whose private
# key is the secret INPUT_SIGNING_P12 (base64 of the .p12) with INPUT_SIGNING_P12_PASSWORD.
# Every release must carry that identity: macOS ties the app's permissions (Accessibility,
# Microphone, Keychain) to it, and an installed copy refuses an update signed by any other.
# Without the secret (a fork) a run checks and builds the code with an ad-hoc signature and
# publishes nothing.
#
# Each build is a release of its own, and the only one that holds it: v0.1.<build> on the commit
# it was built from, holding out-0.1.<build>.zip (the app, which install.sh and the installed
# copies download) and out.json (version, file, size, sha256) naming it. There is no disk image
# or other installer: out is installed by the command in the README. The repository's tags are
# its publishers' alone, and this workflow makes none. Installed copies read the newest release's
# out.json, and our site serves the same (https://dashboard.subnsub.com/api/input/out.json).
#
# The app was called put until 0.1.49 (and input before that). Copies of put read put.json and
# take only put-<version>.zip holding put.app, so each release also holds that pair: the same
# signed app, its folder named put.app. Started from /Applications/put.app it moves itself to
# out.app and reads out.json from then on (Relocation). Copies up to 0.1.48 read the standing
# pre-release "builds" instead; while that release is there, the put pair goes in it too. Both
# stay until every Mac runs out; then the builds release is deleted and the put pair is dropped
# from here.
# Each zip and manifest also get a build provenance attestation (GitHub's, recorded in the public
# Sigstore log), so that anyone can check which run of this workflow, from which commit, built
# them. The build number is one more than the larger of the newest build released here and the
# build the site's feed names now, so it only grows.

name: release

on:
  push:
    branches: [main]
    paths-ignore: [README.md, LICENSE]
    tags: ['v0.1.*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write       # the release
      id-token: write       # the attestation's signing certificate (Sigstore)
      attestations: write   # storing the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Checks
        run: |
          swift run QingyanChecks
          sh -n install.sh

      - name: Build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Whether the old feed release "builds" is there: present, or gone (GitHub says 404).
          # Anything else is not knowing, which stops the run rather than guess.
          old_feed() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" --jq .id 2>&1); then echo present; return 0; fi
              case "$out" in *"HTTP 404"*) echo gone; return 0 ;; esac
              sleep 5
            done
            echo "::error::the old feed release builds could not be read: $out" >&2; return 1
          }
          # The newest build released: the version releases (other than this tag's own, which a
          # rerun finds), and the old feed release while it is there.
          released=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq "[.[].tagName | select(. != \"$GITHUB_REF_NAME\") | capture(\"^v0\\\\.1\\\\.(?<n>[0-9]+)$\").n | tonumber] | max // 0") \
            || { echo "::error::the releases could not be read, so the next build number is unknown"; exit 1; }
          state=$(old_feed) || exit 1
          if [ "$state" = present ]; then
            old=$(gh release view builds --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name | capture("^(input|put|out)-0\\.1\\.(?<n>[0-9]+)\\.zip$").n | tonumber] | max // 0') \
              || { echo "::error::the old feed release builds could not be read"; exit 1; }
            released=$(( old > released ? old : released ))
          fi
          # What the site's feed names: out.json, put.json for copies of put, and latest.json for
          # copies named input while it still answers. Retried: a runner's resolver sometimes misses
          # a name for a moment.
          served=0
          for manifest in out.json put.json latest.json; do
            code=$(curl -sS --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' \
              "https://dashboard.subnsub.com/api/input/$manifest") || code=000
            if [ "$code" = 404 ]; then continue; fi
            [ "$code" = 200 ] || { echo "::error::the update feed's $manifest could not be read (HTTP $code), so the next build number is unknown"; exit 1; }
            n=$(python3 -c 'import json, sys; print(int(json.load(open(sys.argv[1]))["version"].rsplit(".", 1)[1]))' "$RUNNER_TEMP/feed.json")
            served=$(( n > served ? n : served ))
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A publisher's tag names the build itself: it must be ahead of everything already
            # out, and on main — the tag is checked, never made here.
            [[ "$GITHUB_REF_NAME" =~ ^v0\.1\.([1-9][0-9]*)$ ]] || {
              echo "::error::a release tag is v0.1.<build> with no leading zero, got $GITHUB_REF_NAME"; exit 1; }
            build=${BASH_REMATCH[1]}
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
              echo "::error::the tag is not on main"; exit 1; }
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              # Its release is out already: a rerun after the old feed was not brought up to date.
              # Nothing is built or released again; the old feed step copies what was released.
              echo "REPAIR=true" >> "$GITHUB_ENV"
              echo "Build $build: released already, so this run only brings the old feed up to date"
            else
              [ "$build" -gt "$released" ] && [ "$build" -gt "$served" ] || {
                echo "::error::v0.1.$build is not ahead of what is out (release $released, feed $served)"; exit 1; }
              echo "Build $build (tag $GITHUB_REF_NAME; release $released, feed $served)"
            fi
          else
            # And the version tags: a run that made v<n> but stopped before the feed named it must
            # not try to make v<n> again. Not knowing them stops the run.
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.1." \
              --jq '[.[].ref | capture("^refs/tags/v0\\.1\\.(?<n>[0-9]+)$").n | tonumber] | max // 0') \
              || { echo "::error::the version tags could not be read, so the next build number is unknown"; exit 1; }
            build=$(( released > served ? released : served ))
            build=$(( (build > tagged ? build : tagged) + 1 ))
            echo "Build $build (newest in the feed's release $released, feed $served, version tags $tagged)"
          fi
          echo "INPUT_BUILD=$build" >> "$GITHUB_ENV"

      - name: Signing identity
        if: env.REPAIR != 'true'
        env:
          P12: ${{ secrets.INPUT_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.INPUT_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "::notice::INPUT_SIGNING_P12 is not set: building with an ad-hoc signature, nothing is published"
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"; exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/input-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign finds an identity only in a keychain that is on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/[0-9A-F]{40}/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::the imported certificate holds no signing identity"; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        if: env.REPAIR != 'true'
        run: |
          set -euo pipefail
          bash build.sh
          codesign --verify --strict --verbose=2 build/out.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/out.app/Contents/Info.plist)" = "$INPUT_BUILD" ]

      - name: Forget the signing identity
        # Nothing after the build signs, so no later step (the attestation action included) gets
        # a keychain that holds the key.
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/input-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi

      - name: Package
        id: package
        if: env.SIGNING_IDENTITY != '-' && github.ref_type == 'tag' && env.REPAIR != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The requirement every installed copy holds an update to. A build that does not meet it
          # would be refused by them, so it is not released.
          REQUIREMENT='identifier "local.hopo.qingyan" and certificate root = H"5f3964801c4df9f728472f64717dbc410f4e00d8"'
          codesign --verify --strict -R="$REQUIREMENT" build/out.app
          # A run of an older commit (a rerun) must not publish it as the newest build.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head; this run of $GITHUB_SHA publishes nothing"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version="0.1.$INPUT_BUILD"
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          # The size and digest each on their own, so that a failure stops the run (inside the
          # manifest's printf it would not).
          manifest() {  # manifest <zip> <file name> <out file>
            local size sum
            size=$(stat -f%z "$1")
            sum=$(shasum -a 256 "$1" | cut -d' ' -f1)
            [[ "$size" =~ ^[1-9][0-9]*$ && "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no size or digest for $1"; return 1; }
            printf '{"version":"%s","file":"%s","size":%s,"sha256":"%s"}\n' "$version" "$2" "$size" "$sum" > "$3"
          }
          zip="$out/out-$version.zip"
          ditto -c -k --keepParent build/out.app "$zip"
          manifest "$zip" "out-$version.zip" "$out/out.json"
          # The bridge for copies of put (see the top): the same signed bundle, its folder named put.app.
          mkdir -p "$RUNNER_TEMP/bridge"
          ditto build/out.app "$RUNNER_TEMP/bridge/put.app"
          codesign --verify --strict -R="$REQUIREMENT" "$RUNNER_TEMP/bridge/put.app"
          old="$out/put-$version.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/bridge/put.app" "$old"
          manifest "$old" "put-$version.zip" "$out/put.json"
          { echo "publish=true"; echo "version=$version"; echo "zip=$zip"; echo "out=$out"; } >> "$GITHUB_OUTPUT"

      - name: Attest
        # A provenance attestation for the zips and manifests, signed by GitHub: anyone can check
        # that they were built by this workflow from this commit with
        # `gh attestation verify <file> --repo <this repository>`.
        if: steps.package.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.out }}/*

      - name: Release
        if: steps.package.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          OUT: ${{ steps.package.outputs.out }}
        run: |
          set -euo pipefail
          # This build's own release, on the commit it was built from, marked the latest: its zip
          # and the out.json naming it, which installed copies and install.sh read as the newest,
          # and the put pair for copies of put (see the top).
          {
            printf 'out %s, for Macs with Apple silicon and with Intel (macOS 14 or later), built by GitHub Actions from %s and signed with the input signing certificate (named before the app was renamed put, then out).\n\n' "$VERSION" "$GITHUB_SHA"
            printf 'To install out, or bring it up to date, run this in Terminal (it checks the download and the signature, and macOS does not stop the first launch):\n\n    curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh\n\n' "$GITHUB_REPOSITORY"
            printf 'Installed copies update themselves: out-%s.zip is the app they download, and out.json names it. put-%s.zip and put.json are the same app for copies installed while it was called put, which move themselves to out.app.\n\n' "$VERSION" "$VERSION"
            printf 'Where a file was built: gh attestation verify out-%s.zip --repo %s\n\n## Changes\n\n' "$VERSION" "$GITHUB_REPOSITORY"
            git log -1 --format=%B "$GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          # The tag came first — a publisher pushed it; this run only releases onto it.
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "::error::expected the run of tag v$VERSION, got $GITHUB_REF"; exit 1; }
          gh release create "v$VERSION" "$ZIP" "$OUT/out.json" "$OUT/put-$VERSION.zip" "$OUT/put.json" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "out $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest

      - name: Old feed
        # Copies up to 0.1.48 read only the standing pre-release "builds" (see the top). The put
        # pair that was released goes there too, the released files themselves, so a rerun of a tag whose
        # release is out (REPAIR) brings the old feed up to date the same way.
        if: steps.package.outputs.publish == 'true' || env.REPAIR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Whether the old feed release "builds" is there: present, or gone (GitHub says 404).
          # Anything else is not knowing, which stops the run rather than guess.
          old_feed() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" --jq .id 2>&1); then echo present; return 0; fi
              case "$out" in *"HTTP 404"*) echo gone; return 0 ;; esac
              sleep 5
            done
            echo "::error::the old feed release builds could not be read: $out" >&2; return 1
          }
          state=$(old_feed) || exit 1
          if [ "$state" = gone ]; then echo "The old feed release builds is gone: nothing to do."; exit 0; fi
          VERSION="0.1.$INPUT_BUILD"
          dir="$RUNNER_TEMP/released"; rm -rf "$dir"; mkdir -p "$dir"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "put-$VERSION.zip" --pattern put.json --dir "$dir"
          python3 -c 'import hashlib, json, os, sys
          d, v = sys.argv[1], sys.argv[2]; z = os.path.join(d, "put-" + v + ".zip"); m = json.load(open(os.path.join(d, "put.json")))
          ok = m.get("version") == v and m.get("file") == "put-" + v + ".zip" and m.get("size") == os.path.getsize(z) \
            and m.get("sha256") == hashlib.sha256(open(z, "rb").read()).hexdigest()
          sys.exit(0 if ok else 1)' "$dir" "$VERSION" || { echo "::error::release v$VERSION does not hold a zip and a put.json that agree"; exit 1; }
          # The zip first, then the manifest that names it, so the file it names is always there.
          # A manifest is replaced without the moment in which an upload with --clobber leaves it
          # missing (the old one is deleted first): the new one goes up under a temporary name, the
          # old one steps aside, the new one takes the name, and only then does the old one go; if
          # taking the name fails, the old one gets it back.
          asset_id() { gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          rename_asset() { gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$1" -f name="$2" >/dev/null; }
          delete_asset() { gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$1"; }
          replace() {  # replace <name> <file>
            local name="$1" staged="$1.next" aside="$1.prev" id new old
            for id in $(asset_id "$staged") $(asset_id "$aside"); do delete_asset "$id"; done  # left by a run that stopped halfway
            cp "$2" "$RUNNER_TEMP/$staged"
            gh release upload builds "$RUNNER_TEMP/$staged" --repo "$GITHUB_REPOSITORY"
            new=$(asset_id "$staged"); old=$(asset_id "$name")
            [ -n "$new" ] || { echo "::error::$staged did not arrive"; return 1; }
            if [ -n "$old" ]; then rename_asset "$old" "$aside"; fi
            if ! rename_asset "$new" "$name"; then
              if [ -n "$old" ]; then rename_asset "$old" "$name"; fi
              echo "::error::$name could not be replaced; the previous one is back"; return 1
            fi
            if [ -n "$old" ]; then delete_asset "$old"; fi
          }
          gh release upload builds "$dir/put-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --clobber
          replace put.json "$dir/put.json"
          gh release edit builds --repo "$GITHUB_REPOSITORY" --prerelease --title "put update feed (old)" \
            --notes "Where copies of put up to 0.1.48 look for updates, until every Mac runs out, which reads the newest release instead; then this release is deleted. To install out, see https://github.com/$GITHUB_REPOSITORY#install. put.json names the newest build, put $VERSION, and the zip it names lies beside it."
          # It keeps the three newest put zips (a Mac that read put.json a moment ago still finds
          # the zip it named). The input zips and latest.json are left as they are.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" \
            --jq '[.assets[] | select(.name | test("^put-0\\.1\\.[0-9]+\\.zip$")) | {id, n: (.name | capture("0\\.1\\.(?<n>[0-9]+)").n | tonumber)}] | sort_by(.n) | reverse | .[3:] | .[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
