# Checks, builds, signs and releases put on every push to main, except one that changes only the
# README or the licence: words alone make no new build (and no update on every Mac).
#
# The app is signed with the self-signed certificate "input signing (SUB&SUB)", whose private
# key is the secret INPUT_SIGNING_P12 (base64 of the .p12) with INPUT_SIGNING_P12_PASSWORD.
# Every release must carry that identity: macOS ties the app's permissions (Accessibility,
# Microphone, Keychain) to it, and an installed copy refuses an update signed by any other.
# Without the secret (a fork) a run checks and builds the code with an ad-hoc signature and
# publishes nothing.
#
# Each build is a release of its own, v0.1.<build> on the commit it was built from, holding
# put-0.1.<build>.dmg (the app and a link to Applications, to install from) and
# put-0.1.<build>.zip (the same app, for updates). The repository's tag rules let anyone who can
# write create a v* tag, this workflow included, and nobody but its publishers move or delete one;
# every other tag is theirs alone.
#
# The update feed is the standing pre-release "builds", whose tag a maintainer made once: put.json
# (version, file, size, sha256) and the three newest zips beside it, the zip uploaded first and
# put.json last. A build's own release is made before put.json names it.
#
# The app was called input before. Copies installed then read latest.json and take only
# input-<version>.zip holding input.app, so the first build named put was also published that way,
# once, with "bridge": true in latest.json: started from /Applications/input.app it moves itself
# to put.app and reads put.json from then on. latest.json stays on that build for good; a run
# that finds no bridge there (the first, or after a failed upload) publishes one.
# Each zip also gets a build provenance attestation (GitHub's, recorded in the public Sigstore
# log), so that anyone can check which run of this workflow, from which commit, built it.
# The update feed (https://dashboard.subnsub.com/api/input/put.json) serves from it. The
# build number is one more than the larger of the newest build here and the builds the feed names
# now, so it only grows.

name: release

on:
  push:
    branches: [main]
    paths-ignore: [README.md, LICENSE]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write       # the release
      id-token: write       # the attestation's signing certificate (Sigstore)
      attestations: write   # storing the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Checks
        run: |
          swift run QingyanChecks
          sh -n install.sh

      - name: Build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          released=$(gh release view builds --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | capture("^(input|put)-0\\.1\\.(?<n>[0-9]+)\\.zip$").n | tonumber] | max // 0' 2>/dev/null || echo 0)
          # And the version tags: a run that made v<n> but stopped before the feed named it must not
          # try to make v<n> again. Not knowing them stops the run.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.1." \
            --jq '[.[].ref | capture("^refs/tags/v0\\.1\\.(?<n>[0-9]+)$").n | tonumber] | max // 0') \
            || { echo "::error::the version tags could not be read, so the next build number is unknown"; exit 1; }
          # What the feed names: put.json (missing until the first build named put) and latest.json.
          # Retried: a runner's resolver sometimes misses a name for a moment.
          served=0
          for manifest in put.json latest.json; do
            code=$(curl -sS --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' \
              "https://dashboard.subnsub.com/api/input/$manifest") || code=000
            if [ "$code" = 404 ] && [ "$manifest" = put.json ]; then continue; fi
            [ "$code" = 200 ] || { echo "::error::the update feed's $manifest could not be read (HTTP $code), so the next build number is unknown"; exit 1; }
            n=$(python3 -c 'import json, sys; print(int(json.load(open(sys.argv[1]))["version"].rsplit(".", 1)[1]))' "$RUNNER_TEMP/feed.json")
            served=$(( n > served ? n : served ))
          done
          build=$(( released > served ? released : served ))
          build=$(( (build > tagged ? build : tagged) + 1 ))
          echo "INPUT_BUILD=$build" >> "$GITHUB_ENV"
          echo "Build $build (newest in the feed's release $released, feed $served, version tags $tagged)"

      - name: Signing identity
        env:
          P12: ${{ secrets.INPUT_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.INPUT_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "::notice::INPUT_SIGNING_P12 is not set: building with an ad-hoc signature, nothing is published"
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"; exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/input-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign finds an identity only in a keychain that is on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/[0-9A-F]{40}/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::the imported certificate holds no signing identity"; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          bash build.sh
          codesign --verify --strict --verbose=2 build/put.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/put.app/Contents/Info.plist)" = "$INPUT_BUILD" ]

      - name: Forget the signing identity
        # Nothing after the build signs, so no later step (the attestation action included) gets
        # a keychain that holds the key.
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/input-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi

      - name: Package
        id: package
        if: env.SIGNING_IDENTITY != '-' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The requirement every installed copy holds an update to. A build that does not meet it
          # would be refused by them, so it is not released.
          REQUIREMENT='identifier "local.hopo.qingyan" and certificate root = H"5f3964801c4df9f728472f64717dbc410f4e00d8"'
          codesign --verify --strict -R="$REQUIREMENT" build/put.app
          # A run of an older commit (a rerun) must not publish it as the newest build.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head; this run of $GITHUB_SHA publishes nothing"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version="0.1.$INPUT_BUILD"
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          zip="$out/put-$version.zip"
          ditto -c -k --keepParent build/put.app "$zip"
          size=$(stat -f%z "$zip")
          sum=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          printf '{"version":"%s","file":"%s","size":%s,"sha256":"%s"}\n' "$version" "put-$version.zip" "$size" "$sum" > "$RUNNER_TEMP/put.json"
          # The disk image to install from: a window with put, a link to Applications and the
          # background drawn for it (Resources/dmg), laid out by dmgbuild (tools/dmg-settings.py).
          # dmgbuild is pinned by version and hash, and runs after the signing keychain is gone.
          # hdiutil on a runner sometimes finds its device busy for a moment, so it is tried three times.
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --require-hashes --only-binary :all: --no-deps -r tools/dmg-requirements.txt
          dmg="$out/put-$version.dmg"
          made=false
          for attempt in 1 2 3; do
            rm -f "$dmg"
            if "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s tools/dmg-settings.py -D app="$PWD/build/put.app" \
                -D background="$PWD/Resources/dmg/background.png" -D icon="$PWD/Resources/AppIcon.icns" put "$dmg"; then
              made=true; break
            fi
            sleep 5
          done
          [ "$made" = true ] || { echo "::error::the disk image could not be made"; exit 1; }
          hdiutil verify -quiet "$dmg"
          # What it holds must be the build that was just checked, as it is. The image is detached
          # however the checks end; a detach the system refuses for a moment is tried again, and
          # one that never works does not stop the release (the runner is thrown away).
          mnt="$(mktemp -d)"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          detach() {
            for attempt in 1 2 3; do hdiutil detach -quiet "$mnt" && return 0; sleep 3; done
            hdiutil detach -quiet -force "$mnt" || echo "::warning::the disk image stayed attached at $mnt"
          }
          trap detach EXIT
          codesign --verify --strict -R="$REQUIREMENT" "$mnt/put.app"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$mnt/put.app/Contents/Info.plist")" = "$INPUT_BUILD" ]
          # And the window: its layout, its background, the link.
          [ -f "$mnt/.DS_Store" ] && [ -f "$mnt/.background.tiff" ] && [ -L "$mnt/Applications" ]
          trap - EXIT
          detach
          # The bridge for copies from before the rename (see the top): the same signed bundle, its
          # folder named input.app. A run that cannot read latest.json publishes it again, which
          # only moves those copies on to a newer build that is just as able to move them.
          bridge=false
          if ! gh release download builds --repo "$GITHUB_REPOSITORY" --pattern latest.json --output - 2>/dev/null \
              | python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("bridge") is True else 1)'; then
            bridge=true
            mkdir -p "$RUNNER_TEMP/bridge"
            ditto build/put.app "$RUNNER_TEMP/bridge/input.app"
            codesign --verify --strict -R="$REQUIREMENT" "$RUNNER_TEMP/bridge/input.app"
            old="$out/input-$version.zip"
            ditto -c -k --keepParent "$RUNNER_TEMP/bridge/input.app" "$old"
            printf '{"version":"%s","file":"%s","size":%s,"sha256":"%s","bridge":true}\n' "$version" "input-$version.zip" \
              "$(stat -f%z "$old")" "$(shasum -a 256 "$old" | cut -d' ' -f1)" > "$RUNNER_TEMP/latest.json"
          fi
          { echo "publish=true"; echo "version=$version"; echo "zip=$zip"; echo "out=$out"; echo "bridge=$bridge"; } >> "$GITHUB_OUTPUT"

      - name: Attest
        # A provenance attestation for the zip, signed by GitHub: anyone can check that it was built
        # by this workflow from this commit with `gh attestation verify <zip> --repo <this repository>`.
        if: steps.package.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.out }}/*

      - name: Release
        if: steps.package.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          OUT: ${{ steps.package.outputs.out }}
          BRIDGE: ${{ steps.package.outputs.bridge }}
        run: |
          set -euo pipefail
          # This build's own release, on the commit it was built from, marked the latest.
          {
            printf 'put %s, for Macs with Apple silicon and with Intel (macOS 14 or later), built by GitHub Actions from %s and signed with the input signing certificate (named before the app was renamed put).\n\n' "$VERSION" "$GITHUB_SHA"
            printf 'To install put on a Mac that does not have it, run this in Terminal (it checks the download and the signature, and macOS does not stop the first launch):\n\n    curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh\n\n' "$GITHUB_REPOSITORY"
            printf 'Or open put-%s.dmg and drag put onto Applications, then open it once and allow it under System Settings → Privacy & Security (the build is not notarized). Installed copies update themselves; put-%s.zip is the same app, for those updates.\n\n' "$VERSION" "$VERSION"
            printf 'Where a file was built: gh attestation verify put-%s.dmg --repo %s\n\n## Changes\n\n' "$VERSION" "$GITHUB_REPOSITORY"
            git log -1 --format=%B "$GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          # The tag first, on the commit that was built: creating a ref that is there already fails,
          # so this build is never attached to a tag someone else made meanwhile.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "v$VERSION" "$OUT/put-$VERSION.dmg" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "put $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          # Then the update feed: the zip first, then the manifest that names it, so the file it names
          # is always there. A manifest is replaced without the moment in which an upload with
          # --clobber leaves it missing (the old one is deleted first): the new one goes up under a
          # temporary name, the old one steps aside, the new one takes the name, and only then does
          # the old one go; if taking the name fails, the old one gets it back.
          asset_id() { gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          rename_asset() { gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$1" -f name="$2" >/dev/null; }
          delete_asset() { gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$1"; }
          replace() {  # replace <name> <file>
            local name="$1" staged="$1.next" aside="$1.prev" id new old
            for id in $(asset_id "$staged") $(asset_id "$aside"); do delete_asset "$id"; done  # left by a run that stopped halfway
            cp "$2" "$RUNNER_TEMP/$staged"
            gh release upload builds "$RUNNER_TEMP/$staged" --repo "$GITHUB_REPOSITORY"
            new=$(asset_id "$staged"); old=$(asset_id "$name")
            [ -n "$new" ] || { echo "::error::$staged did not arrive"; return 1; }
            if [ -n "$old" ]; then rename_asset "$old" "$aside"; fi
            if ! rename_asset "$new" "$name"; then
              if [ -n "$old" ]; then rename_asset "$old" "$name"; fi
              echo "::error::$name could not be replaced; the previous one is back"; return 1
            fi
            if [ -n "$old" ]; then delete_asset "$old"; fi
          }
          gh release upload builds "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          replace put.json "$RUNNER_TEMP/put.json"
          if [ "$BRIDGE" = true ]; then
            gh release upload builds "$OUT/input-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --clobber
            replace latest.json "$RUNNER_TEMP/latest.json"
          fi
          gh release edit builds --repo "$GITHUB_REPOSITORY" --prerelease --title "put update feed" \
            --notes "Where installed copies of put look for updates. To download put, take the newest release instead: https://github.com/$GITHUB_REPOSITORY/releases/latest. put.json names the newest build, put $VERSION, and the zip it names lies beside it. latest.json names the one build that copies installed while the app was called input update to; it moves them to put."
          # The feed keeps the three newest put zips (a Mac that read put.json a moment ago still
          # finds the zip it named) and no disk images, which are in the builds' own releases. The
          # input zips (the bridge, and builds from before it) are left.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" \
            --jq '[.assets[] | select(.name | test("^put-0\\.1\\.[0-9]+\\.zip$")) | {id, n: (.name | capture("0\\.1\\.(?<n>[0-9]+)").n | tonumber)}] | sort_by(.n) | reverse | .[3:] | .[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" --jq '.assets[] | select(.name | test("^put-0\\.1\\.[0-9]+\\.dmg$")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
