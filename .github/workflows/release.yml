# A one-off run on a check branch: run out's checks and build it.
name: release

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks
        run: |
          set +e
          swift run QingyanChecks > "$RUNNER_TEMP/checks.log" 2>&1
          echo "exit $?"
          grep -nE "FAIL|error|PASS Links|PASS Shelf|All checks passed" "$RUNNER_TEMP/checks.log" | cut -c1-600 | tail -40
          echo "-- tail"; tail -15 "$RUNNER_TEMP/checks.log" | cut -c1-400
          grep -q "All checks passed" "$RUNNER_TEMP/checks.log"

      - name: Build
        if: always()
        run: |
          set +e
          swift build --product Qingyan > "$RUNNER_TEMP/build.log" 2>&1; code=$?
          grep -nE "error|Shelf.swift|HelperLink.swift|Build complete" "$RUNNER_TEMP/build.log" | cut -c1-600 | tail -60
          exit $code
